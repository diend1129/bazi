<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光耀 四柱推命 - 今日運勢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F7F6F5; color: #333333; }
        .font-serif { font-family: 'Noto Serif TC', serif; }
        .color-wood  { color: #6B7A6A; }
        .color-fire  { color: #A65B54; }
        .color-earth { color: #B0A18E; }
        .color-metal { color: #C5B276; }
        .color-water { color: #5B6E80; }
        .border-thin { border: 0.5px solid #E0DCD3; }
        .divide-thin > * + * { border-top: 0.5px solid #E0DCD3; }
    </style>
</head>
<body class="py-6 px-4">
    <div class="w-full max-w-md mx-auto">

        <header class="text-center mb-6">
            <div class="text-[9px] tracking-widest text-gray-400 uppercase mb-0.5">Guang Yao BaZi</div>
            <h1 class="text-xl font-bold tracking-widest font-serif">光耀 四柱推命</h1>
            <p class="text-[11px] text-gray-400 mt-0.5">日式極簡 · 每日流日運勢自動更新</p>
        </header>

        <!-- 今日資訊卡 -->
        <section class="bg-white border-thin rounded-sm p-4 mb-4 text-center">
            <div class="text-[11px] text-gray-400 tracking-wider mb-1" id="currentDateText">公曆載入中…</div>
            <div class="text-xs font-medium mb-2" id="lunarDateText">舊曆載入中…</div>
            <hr class="border-t-[0.5px] border-[#E0DCD3] my-2 w-8 mx-auto">
            <div class="text-[10px] text-gray-400 mb-0.5">今日流日</div>
            <div class="text-2xl font-bold font-serif my-1" id="flowDayPillar">--</div>
            <div class="text-[11px] text-gray-500 font-serif mt-1" id="jieQiText">節氣載入中…</div>
        </section>

        <!-- 十天干運勢列表 -->
        <section class="bg-white border-thin rounded-sm p-4">
            <div class="font-serif text-xs font-bold tracking-wider pb-2 border-b-[0.5px] border-[#E0DCD3] mb-3 flex justify-between items-center">
                <span>十天干今日運勢解析</span>
                <span class="text-[10px] font-sans text-gray-400 font-normal">依日主對照</span>
            </div>
            <div id="fortuneList" class="divide-thin"></div>
        </section>

    </div>

    <script>
        function getWuxingClass(stem) {
            if (['甲','乙'].includes(stem)) return 'color-wood';
            if (['丙','丁'].includes(stem)) return 'color-fire';
            if (['戊','己'].includes(stem)) return 'color-earth';
            if (['庚','辛'].includes(stem)) return 'color-metal';
            if (['壬','癸'].includes(stem)) return 'color-water';
            return '';
        }

        function getWuxingName(stem) {
            if (['甲','乙'].includes(stem)) return '木';
            if (['丙','丁'].includes(stem)) return '火';
            if (['戊','己'].includes(stem)) return '土';
            if (['庚','辛'].includes(stem)) return '金';
            return '水';
        }

        function calculateFortune(tg, flowStem) {
            const Stems = {
                '甲': { wuxing: '木', yang: true },  '乙': { wuxing: '木', yang: false },
                '丙': { wuxing: '火', yang: true },  '丁': { wuxing: '火', yang: false },
                '戊': { wuxing: '土', yang: true },  '己': { wuxing: '土', yang: false },
                '庚': { wuxing: '金', yang: true },  '辛': { wuxing: '金', yang: false },
                '壬': { wuxing: '水', yang: true },  '癸': { wuxing: '水', yang: false }
            };
            const relations = {
                '木': { '木':'比劫', '火':'食傷', '土':'財星', '金':'官殺', '水':'印星' },
                '火': { '木':'印星', '火':'比劫', '土':'食傷', '金':'財星', '水':'官殺' },
                '土': { '木':'官殺', '火':'印星', '土':'比劫', '金':'食傷', '水':'財星' },
                '金': { '木':'財星', '火':'官殺', '土':'印星', '金':'比劫', '水':'食傷' },
                '水': { '木':'食傷', '火':'財星', '土':'官殺', '金':'印星', '水':'比劫' }
            };
            const me = Stems[tg];
            const day = Stems[flowStem];
            const group = relations[me.wuxing][day.wuxing];
            const same = (me.yang === day.yang);
            let tenGod = '', luckLevel = '平', desc = '';

            if (group === '比劫') {
                tenGod = same ? '比肩' : '劫財';
                desc = same
                    ? '今日多遇同輩，宜交流合作，唯需注意固執己見。'
                    : '今日心思易變，防破財或心浮氣躁，凡事宜緩。';
            } else if (group === '食傷') {
                tenGod = same ? '食神' : '傷官'; luckLevel = '中吉';
                desc = same
                    ? '才華、口福雙至，心情愉悅，利於企劃與放鬆。'
                    : '思緒活躍，點子頗多，但需謹言慎行，防言多必失。';
            } else if (group === '財星') {
                tenGod = same ? '偏財' : '正財'; luckLevel = '大吉';
                desc = same
                    ? '機遇突現，利於開拓業務或經商，財氣較旺。'
                    : '財運穩定，求財得財，利於落實計畫，腳踏實地。';
            } else if (group === '官殺') {
                tenGod = same ? '七殺' : '正官';
                luckLevel = same ? '小凶' : '中吉';
                desc = same
                    ? '壓力驟增，需防小人或情緒波動，今日宜靜。'
                    : '貴人運佳，工作易得賞識，條理分明，利於開展業務。';
            } else if (group === '印星') {
                tenGod = same ? '偏印' : '正印'; luckLevel = '中吉';
                desc = same
                    ? '領悟力高，利於鑽研玄學理學，思慮宜開闊。'
                    : '內心安穩，易得長輩幫助，利於學習與合約文書。';
            }
            return { tenGod, luckLevel, desc };
        }

        window.onload = function () {
            const today = new Date();
            const y = today.getFullYear();
            const m = today.getMonth() + 1;
            const d = today.getDate();

            document.getElementById('currentDateText').innerText =
                '公曆 ' + y + '年' + m + '月' + d + '日';

            try {
                const solar = Solar.fromYmdHms(y, m, d, 12, 0, 0);
                const lunar = solar.getLunar();
                const flowDay = lunar.getEightChar().getDay();
                const flowStem = flowDay[0];
                const flowBranch = flowDay[1];

                document.getElementById('lunarDateText').innerText =
                    '舊曆 ' + lunar.getYearInGanZhi() + '年 ' +
                    lunar.getMonthInChinese() + '月' +
                    lunar.getDayInChinese();

                document.getElementById('flowDayPillar').innerHTML =
                    '<span class="' + getWuxingClass(flowStem) + '">' + flowStem + '</span>' +
                    '<span class="' + getWuxingClass(flowBranch) + '">' + flowBranch + '</span>';

                document.getElementById('jieQiText').innerText =
                    '目前處於「' + lunar.getPrevJieQi(true).getName() + '」節氣管轄範圍';

                const tenStems = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
                const container = document.getElementById('fortuneList');

                tenStems.forEach(function (stem) {
                    const res = calculateFortune(stem, flowStem);
                    let lvlColor = 'text-gray-500';
                    if (res.luckLevel === '大吉') lvlColor = 'text-[#A65B54] font-bold';
                    if (res.luckLevel === '中吉') lvlColor = 'text-[#789262] font-bold';
                    if (res.luckLevel === '小凶') lvlColor = 'text-[#5B6E80]';

                    const row = document.createElement('div');
                    row.className = 'py-2.5 flex items-start gap-2 text-[11px]';
                    row.innerHTML =
                        '<div class="flex flex-col items-center min-w-[45px] shrink-0">' +
                            '<div class="font-serif text-sm font-bold ' + getWuxingClass(stem) + '">' +
                                stem +
                                '<span class="text-[9px] font-normal text-gray-400 ml-0.5">' + getWuxingName(stem) + '</span>' +
                            '</div>' +
                            '<span class="text-[9px] bg-gray-100 text-gray-500 px-1 py-px rounded-sm font-serif mt-0.5">' + res.tenGod + '</span>' +
                        '</div>' +
                        '<div class="flex-1">' +
                            '<span class="' + lvlColor + ' font-serif tracking-wider mr-1">[' + res.luckLevel + ']</span>' +
                            '<span class="text-gray-600 leading-relaxed font-light">' + res.desc + '</span>' +
                        '</div>';
                    container.appendChild(row);
                });

            } catch (e) {
                document.getElementById('lunarDateText').innerText = '農曆資料載入失敗，請重新整理。';
                document.getElementById('jieQiText').innerText = '';
                console.error(e);
            }
        };
    </script>
</body>
</html>
